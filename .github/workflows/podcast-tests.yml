name: Prepared podcasts
on:
  pull_request:
  push:
    branches: [develop]
permissions:
  contents: read
jobs:
  podcast-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Build and verify backend and bundled frontend
        run: docker build -f DockerfilePodcastTests -t teddycloud-podcast-tests .
      - name: Run deterministic service tests
        run: docker run --rm teddycloud-podcast-tests make test_podcast
